# This a config file for triagebot

[range-diff]

[review-changes-since]

[mentions."#[rustc_attr]"]
type = "content"
cc = ["@Urgau"]

[mentions."a.txt"]
cc = ["Urgau"]

[shortcut]

[relabel]

[assign]

[assign.owners]
"*" = ["@Urgau"]

[assign.min_reviews]
minimum = 1
label = "S-waiting-on-community-reviews"

[review-submitted]
# These labels are removed when a review is submitted.
review_labels = ["S-waiting-on-review"]
# This label is added when a review is submitted.
reviewed_label = "S-waiting-on-author"

#[view-all-comments-link]
#threashold = 5

[merge-conflicts]

#[merge]
#type = "merge-queue"

[lock]
